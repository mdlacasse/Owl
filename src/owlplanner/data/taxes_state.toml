# State income tax data for Owl retirement planner (2026 basis).
#
# Adapted from drawdowncalc (https://github.com/hubcity/drawdowncalc) and
# extended with retirement income exemption caps, SS phase-out thresholds,
# pension-specific exemptions, and age requirements.
#
# Fields:
#   brackets                  = [[lower_income, rate_pct], ...]
#                               rate_pct in percent (e.g. 5.35 = 5.35%).
#                               Lower bound where that marginal rate begins.
#                               Last entry has no upper bound.
#   standard_deduction        = dollar amount of the standard deduction PLUS any state
#                               personal exemptions (taxpayer and spouse), since both
#                               reduce taxable income the same way. Not inflation-adjusted
#                               in file; Owl applies gamma_n scaling at runtime.
#                               Income-based phase-outs are not modeled.
#                               "federal" = the state allows the federal standard deduction
#                               itself (AZ, CO, DC, IA, ID, MO, MT, ND, NM), recomputed each
#                               year by Owl with the additional amount for age 65+.
#   senior_deduction          = true/false — with a "federal" deduction, whether the state also
#                               allows the OBBBA $6,000 senior deduction (default false). True
#                               for CO, ID, ND, which begin from federal taxable income and
#                               pick it up (Tax Foundation, Sept 2025).
#   tax_social_security       = true/false — whether state taxes SS benefits at all
#   ss_exemption_threshold    = AGI below which SS is fully exempt (0 = not applicable).
#                               Only meaningful when tax_social_security = true.
#   retirement_income_exemption = dollar cap per person for IRA/pension income:
#                                 0   = fully taxed (no exemption)
#                                -1   = fully exempt (IL, PA, MS, IA...)
#                                N>0  = dollar cap per person (NY=$20k, CO=$24k...)
#   exemption_age             = minimum age to qualify for retirement_income_exemption
#                               (0 = no age requirement)
#   pension_exemption         = additional dollar cap applying only to defined-benefit
#                               pension income (0 = use retirement_income_exemption for all)
#   roth_conversion_eligible  = true/false — whether Roth conversion income counts toward
#                               retirement_income_exemption (default true; false for MD,
#                               whose pension exclusion does not cover IRAs or conversions)
#   brackets_indexed          = true/false — whether bracket thresholds grow with inflation
#   deduction_indexed         = true/false — whether the state's own standard deduction or
#                               personal exemption grows with inflation (true when it is tied
#                               to the indexed federal deduction; ignored for "federal")
#   exemptions_indexed        = true/false — whether retirement_income_exemption,
#                               pension_exemption and ss_exemption_threshold grow with inflation
#   All three are required. A false flag keeps those amounts at their statutory nominal value
#   in every plan year. Bracket and deduction flags follow the Tax Foundation 2026 table's
#   indexing markers; exemption flags were checked against each state's 2025 instructions
#   (only MD indexes its cap, to the maximum Social Security benefit).
#
# Optional per-filer amounts (inline tables), for each living filer: both spouses until the
# first death, then the survivor.
#   personal_exemption = { amount, indexed } — subtracted from state taxable income, any age
#   senior_exemption   = { amount, age, indexed } — subtracted from state taxable income from
#                        the year the filer reaches age (on December 31)
#   personal_credit    = { amount, indexed } — subtracted from the state tax, down to zero
#   senior_credit      = { amount, age, indexed } — the same, from the year the filer reaches age
#   Income-based phase-outs of these amounts are not modeled.
#
# Optional fields not in upstream Owl (fork fmateoc/Owl):
#   recapture_agi_start       = state AGI above which the state takes back the benefit of the
#                               lower brackets (NY: $107,650). Omit for states without it. Above
#                               it, the tax is the bracket tax plus a supplemental amount that
#                               phases in over recapture_width of AGI, tier by tier; see
#                               tax_state.state_recapture for the rule, which reproduces the
#                               IT-201-I worksheets. Amounts follow from the brackets, so a rate
#                               change needs no other edit.
#   recapture_width           = AGI dollars over which each tier phases in (default 50000)
#   recapture_until           = highest bracket threshold that starts a tier
#   retirement_exclusion_tiers = [[income_ceiling, pct], ...] — an exclusion of pensions, annuities,
#                               IRA withdrawals and Roth conversions that depends on household
#                               income (NJ-1040 line 28a). In the first tier whose ceiling the
#                               state income before the exclusion does not exceed, pct percent of
#                               eligible income is excluded, up to retirement_exclusion_cap; above
#                               the last ceiling, nothing. The steps are cliffs, as in the statute.
#                               Only the income of a filer who has reached retirement_exclusion_age
#                               by December 31 is eligible. Omit for states without it.
#   retirement_exclusion_cap  = dollar cap on that exclusion
#   retirement_exclusion_age  = age by December 31 from which a filer's income is eligible
#   retirement_exclusion_earned_limit = when wages are at or below this amount and every filer
#                               has reached the age, the unused part of the cap also covers other
#                               income (NJ line 28b): the exclusion becomes pct percent of total
#                               income, up to the cap. Omit if the state has no such extension.
#
# Exemption caps are per person: each spouse's exemption is limited by that spouse's own
# age and eligible income (tax-deferred withdrawals, Roth conversions, pensions), and an
# unused portion cannot be claimed by the other spouse.
#
# Sources: State DOR publications, Tax Foundation 2026 data, and official withholding tables.
# Audited September 2026 against the Tax Foundation 2026 table (Feb 2026) and 2026 session
# laws enacted after it (AR, AZ, GA, ME, SC, UT, WV). Approximate for complex phase-outs.

