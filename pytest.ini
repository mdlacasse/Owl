[pytest]
testpaths = tests
pythonpath = . src ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Custom markers
markers =
    toml: tests that load example TOML cases
    deep: slow checks of solution quality (exact or searched solves), run on demand with -m deep
# Deep checks are left out of the default run (CI, make tests): run them with `pytest -m deep`
# when changing an algorithm or a feature they cover. A later -m on the command line replaces this.
addopts = -m "not deep"
# addopts = -v --cov=owlplanner --cov-report=term-missing 
