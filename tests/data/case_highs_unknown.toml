case_name = "HiGHS solver-error regression (issue #139)"
description = """
Reported in issue #139: with this exact combination of balances and rate seed, HiGHS
stops with model status 'Unknown' after failing to postsolve, while MOSEK solves the
same model to optimality and even the failing HiGHS run prints an objective within
rounding of MOSEK's answer. The plan is feasible; the solver is what breaks.

Kept as a fixture so the classification is exercised on a real failure rather than a
synthetic one, and so a future highspy release that fixes the underlying trouble is
noticed (test_solver_status.py reports it rather than silently passing). The inputs
are fragile by nature -- changing the seed by one, or nudging a balance, makes HiGHS
solve it -- so nothing here should be edited.
"""

[basic_info]
status = "married"
