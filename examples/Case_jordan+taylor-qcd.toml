case_name = "jordan+taylor-qcd"
description = """
Jordan and Taylor as in the base case, with one change: they give to charity through Qualified Charitable Distributions. Jordan gives $50k/year and Taylor $25k/year, each starting the year they reach age 70½ (2029 and 2030). Everything else—balances, real estate, mortgage, Minnesota residency, seeded IRMAA brackets—is identical, so a comparison against Case_jordan+taylor isolates what the QCD does.

A QCD goes straight from the tax-deferred account to the charity. It never enters AGI, so it is invisible to federal and state income tax, to the taxability of Social Security, and to the MAGI that sets IRMAA and NIIT. It counts toward the required minimum distribution, and it is not spendable cash.

Run against the same gift funded from after-tax cash instead, the household gives an identical $1.17M (today's dollars) and ends with about $148k more estate—$220k less in tax and Medicare premiums, partly given back through a larger portfolio. About $1.30M of the giving satisfies RMDs outright. The freed ordinary-income headroom does not go unused: the optimizer converts it to Roth dollar-for-dollar, so taxable income barely moves and the benefit lands in the estate.

This case demonstrates the QCD age-70½ eligibility gate engaging mid-plan, the RMD credit, and the AGI exclusion propagating to state tax and IRMAA.
"""

