case_name = "avery+quinn"
description = "Avery and Quinn are a married couple in Illinois, well into retirement. Avery turns 73 in 2026, the first year of required minimum distributions; Quinn, three years older, has taken them since 2022. Almost all of their savings sits in tax-deferred accounts, $3.8M in Avery's name and $1.85M in Quinn's, with $100k each in taxable accounts and no Roth. Both already collect Social Security, and Avery bought a single-premium immediate annuity in 2023 that pays $3,700 a month for life and continues in full to Quinn. They own their house and a beach house. They expect to carry a $400,000, 15-year mortgage from 2028, and the house is sold eight years before the end of the plan, the year Avery's horizon ends. The beach house is kept to the end. Illinois exempts retirement income, so withdrawals, conversions and Social Security carry no state tax.\n\nThey give through Qualified Charitable Distributions: Avery $40,000 a year for ten years (2026-2035), Quinn $15,000 a year for life. Both are past 70 1/2 from the start, so the QCDs count toward the RMDs from the first year, including Avery's first one, and Quinn's keep going after Avery's death.\n\nWhat sets the case apart is the estate plan. Avery's accounts all go to the children at Avery's death; none goes to Quinn (beneficiary fractions of 0). The plan maximizes the final bequest at a fixed net spending, so the money that leaves at the first death is worth nothing to the objective except through the small weight given to the partial bequest (partialBequestWeight). The partial bequest is therefore floating: plans with nearly the same final bequest can leave the children very different amounts at the first death.\n\nThe case also covers an RMD that starts in the first plan year, QCDs that stop mid-plan and continue past the first death, an annuity bought before the plan with a full survivor benefit, a debt and two fixed assets, one sold mid-plan, and Social Security taxability in loop mode through the survivor years, where Quinn's benefit is large next to Quinn's other income and well under 85% of it is taxable.\n"

